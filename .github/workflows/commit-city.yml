name: Commit city refresh

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/commit-city.yml"
      - "scripts/update_city.py"
  schedule:
    - cron: "*/15 * * * *"
    - cron: "7 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-contribution-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build city from daily commit data
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: TheVoidJulius
          PROFILE_REPO: TheVoidJulius/TheVoidJulius
          CITY_FULL_REFRESH: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '7 3 * * *' }}
        run: python scripts/update_city.py

      - name: Commit city changes
        env:
          GITHUB_AUTHOR_NAME: TheVoidJulius
          GITHUB_AUTHOR_EMAIL: 216037370+TheVoidJulius@users.noreply.github.com
          GITHUB_COMMITTER_NAME: github-actions[bot]
          GITHUB_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git config user.name "$GITHUB_AUTHOR_NAME"
          git config user.email "$GITHUB_AUTHOR_EMAIL"
          git add assets/commit-city.svg data/commit-city.json
          if git diff --cached --quiet; then
            echo "No city changes."
            exit 0
          fi
          GIT_COMMITTER_NAME="$GITHUB_COMMITTER_NAME" GIT_COMMITTER_EMAIL="$GITHUB_COMMITTER_EMAIL" git commit -m "chore(profile): refresh commit city [skip ci]"
          git push origin HEAD:main
