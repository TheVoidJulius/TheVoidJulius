<text x="1012.0" y="269" class="month" text-anchor="middle">Nov</text>
<path d="M251 250h784" stroke="#345342" stroke-width="1"/>
<text x="1070" y="269" class="label" text-anchor="end">AUTOMATED / REAL GITHUB DATA</text>
</svg>
