<text x="409.0" y="269" class="month" text-anchor="middle">Feb</text>
<rect x="459" y="218" width="34" height="31" rx="5" fill="url(#bar-fill)"/>
<text x="476.0" y="269" class="month" text-anchor="middle">Mar</text>
<rect x="526" y="214" width="34" height="35" rx="5" fill="url(#bar-fill)"/>
<text x="543.0" y="269" class="month" text-anchor="middle">Apr</text>
<rect x="593" y="206" width="34" height="43" rx="5" fill="url(#bar-fill)"/>
<text x="610.0" y="269" class="month" text-anchor="middle">May</text>
<rect x="660" y="216" width="34" height="33" rx="5" fill="url(#bar-fill)"/>
<text x="677.0" y="269" class="month" text-anchor="middle">Jun</text>
<rect x="727" y="217" width="34" height="32" rx="5" fill="url(#bar-fill)"/>
<text x="744.0" y="269" class="month" text-anchor="middle">Jul</text>
